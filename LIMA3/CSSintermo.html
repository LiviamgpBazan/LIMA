<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edg">
    <title>CSS_intermo</title>
    <!--    Declaração do CSS interno  -->
    <style>
        h1,
        h2,
        h3 {
            color: brown;
            text-align: center;
            font-size: 72px;
        }

        p {
            font-size: 72px;
            text-align: center;
        }

        .fonte {
            color: blue;
            font-size: 45px;
        }
    </style>
</head>

<body>
    <h1>Livia Bazan</h1>
    <p>Estudante de desenvolvimento de sistemas</p>
    <p>Lista de Cursos</p>
    <h2 class="fonte">Lista de Cursos transversais </h2>
    <h3 class="fonte">teste</h3>
</body>

</html>
